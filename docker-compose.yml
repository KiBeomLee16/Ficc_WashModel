services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ficc_surveillance
      MYSQL_USER: ${MYSQL_USER:-ficc_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ficc_app}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/mysql_schema_and_sample_data.sql:/docker-entrypoint-initdb.d/01-schema-and-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FICC_DATABASE_URL: jdbc:mysql://mysql:3306/ficc_surveillance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FICC_DATABASE_USER: ${MYSQL_USER:-ficc_app}
      FICC_DATABASE_PASSWORD: ${MYSQL_PASSWORD:-ficc_app}

      FICC_S3_REPORT_ENABLED: ${FICC_S3_REPORT_ENABLED:-false}
      FICC_S3_BUCKET_NAME: ${FICC_S3_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}

    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql-data: