ficc:
  database:
    url: ${FICC_DATABASE_URL:jdbc:mysql://localhost:3306/ficc_surveillance}
    user: ${FICC_DATABASE_USER:root}
    password: ${FICC_DATABASE_PASSWORD:root}

surveillance:
  worker:
    enabled: true
    initial-delay-ms: 3000
    fixed-delay-ms: 5000

logging:
  file:
    name: logs/ficc-wash-surveillance.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/ficc-wash-surveillance.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.portfolio.ficc: INFO
